[package]
name = "export-hls"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
license = "MIT OR Apache-2.0"
description = "Cleartext HLS media playlist parser and HTTP/1.1 fetcher"
repository = "https://github.com/angelonrevelo/export"
readme = "README.md"
publish = false

[dependencies]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[profile.bench]
opt-level = 3
lto = "thin"
codegen-units = 1

[[bench]]
name = "parse"
harness = false

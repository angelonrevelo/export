[package]
name = "export-aac"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
description = "Encode and decode one mono AAC-LC ADTS frame at 44.1 kHz"
publish = false
license = "MIT OR Apache-2.0"

[lib]
path = "src/lib.rs"

[[bin]]
name = "one-frame"
path = "src/bin/one_frame.rs"

[dependencies]

# Single-threaded. No thread pool, no atomics target-feature, no spawned work.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

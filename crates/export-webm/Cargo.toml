[workspace]

[package]
name = "export-webm"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
license = "MIT OR Apache-2.0"
description = "Stream-copy WebM and Matroska. Not a transcode and not a video shrink."
readme = "README.md"
publish = false

[dependencies]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[profile.bench]
opt-level = 3
lto = "thin"
codegen-units = 1

[[bench]]
name = "copy"
harness = false

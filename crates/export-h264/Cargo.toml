[package]
name = "export-h264"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.74"
publish = false
description = "One baseline H.264 I-frame, 4:2:0, Annex B. No dependencies."

# Hot path has no decoder, no C toolchain, and no ffmpeg. Threading is off.

[dependencies]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[profile.bench]
opt-level = 3
lto = "thin"
codegen-units = 1

[[bin]]
name = "iframe"
path = "src/bin/iframe.rs"

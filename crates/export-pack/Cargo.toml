[package]
name = "export-pack"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.74"
description = "Streaming zip read and write. No dependencies."
publish = false
readme = "README.md"

# This directory is its own crate root. Do not fold it into a workspace:
# a workspace profile would override the release settings below.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[[bin]]
name = "pack-bench"
path = "src/bin/pack-bench.rs"

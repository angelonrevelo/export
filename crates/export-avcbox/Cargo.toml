[package]
name = "export-avcbox"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.74"
publish = false
description = "Box Annex B H.264 pictures into a non-fragmented MP4. No dependencies."

# The hot path has no encoder, no C toolchain, and no ffmpeg. Threading is off.

[dependencies]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[profile.bench]
opt-level = 3
lto = "thin"
codegen-units = 1

[[bin]]
name = "avcbox"
path = "src/bin/avcbox.rs"

[[bin]]
name = "avcbox160"
path = "src/bin/avcbox160.rs"

[[bin]]
name = "avcbox160seq"
path = "src/bin/avcbox160seq.rs"

[package]
name = "export-translate"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
license = "MIT OR Apache-2.0"
publish = false
description = "Zero-dependency en↔es transfer translator. Not NLLB."

[[bin]]
name = "export-translate-bench"
path = "src/bin/bench.rs"

[[bin]]
name = "export-translate-paragraph"
path = "src/bin/paragraph-bench.rs"

[dependencies]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

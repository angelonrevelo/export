# Subdomain deployment: export.bygelo.com → 127.0.0.1:8500
# Path-based (bygelo.com/export) needs an app refactor — subdomain is simpler.
# Drop into /etc/nginx/sites-available/ and symlink into sites-enabled/.

server {
    listen 80;
    listen [::]:80;
    server_name export.bygelo.com;

    # Redirect to HTTPS — uncomment after certbot has run.
    # return 301 https://$host$request_uri;

    location / {
        proxy_pass http://127.0.0.1:8500;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Allow large uploads (matches MAX_COMPRESS_TOTAL_BYTES).
        client_max_body_size 500M;

        # Long-running conversions need extended timeouts.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_connect_timeout 60s;
    }
}

# After provisioning a TLS cert (certbot --nginx -d export.bygelo.com), nginx
# will rewrite this block to listen on 443 with ssl_certificate set up.
